<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scholar Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    /* Scholar list (home page) */
    #scholarList {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    #scholarList img {
      width: 200px;
      cursor: pointer;
      border-radius: 10px;
      transition: transform 0.3s;
    }
    #scholarList img:hover {
      transform: scale(1.05);
    }

    /* Step 1 → Thumbnails grid */
    .thumbnailGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .thumbnailGrid img {
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .thumbnailGrid img:hover {
      transform: scale(1.05);
    }

    /* Step 2 → Video layout */
    .videoLayout {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    #mainVideoContainer {
      flex: 2;
      min-width: 300px;
    }
    #mainVideoContainer video {
      width: 100%;
      border-radius: 10px;
    }

    #videoList {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-width: 200px;
    }
    #videoList img {
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s;
    }
    #videoList img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Home: Scholar List -->
  <div id="scholarList"></div>

  <!-- Scholar Details -->
  <div id="scholarDetails"></div>
  <div id="scholorbio"></div>
  <div id="scholorVdo"></div>

  <script>
    // =====================
    // Data
    // =====================
    const scholars = {
      abuBakarId: {
        name: "Abu Bakr Zoud",
        bio: "Australian-Lebanese Islamic scholar, studied at Medina & Al-Azhar",
        videos: [
          { src: "Vdos/Abu Bakar/3 Ways to always be ready for death _ Abu Bakr Zoud.mp4", poster: "Vdos/Abu Bakar/thumbnails/hqdefault.jpg" },
          { src: "Vdos/Abu Bakar/Avoid This MAJOR SIN During Wudu _ Abu Bakr Zoud.mp4", poster: "Vdos/Abu Bakar/thumbnails/hqdefault (1).jpg" },
          { src: "Vdos/Abu Bakar/Do This & Allah Is Shy To Reject Your Dua _ Abu Bakr Zoud.mp4", poster: "Vdos/Abu Bakar/thumbnails/hq720.avif" },
          { src: "Vdos/Abu Bakar/How Does Surah Al-Mulk Protect After Death_ _ Abu Bakr Zoud.mp4", poster: "Vdos/Abu Bakar/thumbnails/hqdefault (2).jpg" },
          { src: "Vdos/Abu Bakar/Proof of the Creator In The Unbearable Beauty of Allah’s Sky _ Abu Bakr Zoud.mp4", poster: "Vdos/Abu Bakar/thumbnails/hqdefault (3).jpg" },
          { src: "Vdos/Abu Bakar/Surah Al Fatiha, The Cure Of Illness _ Abu Bakr Zoud.mp4", poster: "Vdos/Abu Bakar/thumbnails/hqdefault (4).jpg" }
        ]
      },
      hoblos: {
        name: "Mohamed Hoblos",
        bio: "Islamic preacher from Lebanon, now residing in Sydney, Australia",
        videos: [
          { src: "Vdos/Hoblos/Be a Man.mp4", poster: "Vdos/Hoblos/thumbs/be a man.jpg" }
        ]
      }
    };

    const scholarListEl = document.getElementById("scholarList");
    const scholarDetailsEl = document.getElementById("scholarDetails");
    const scholarBioEl = document.getElementById("scholorbio");
    const scholarVdoEl = document.getElementById("scholorVdo");

    // =====================
    // Render Functions
    // =====================

    function renderHome(addToHistory = true) {
      scholarListEl.style.display = "flex";
      scholarDetailsEl.innerHTML = "";
      scholarBioEl.innerHTML = "";
      scholarVdoEl.innerHTML = "";

      // Show all scholars as thumbnails
      scholarListEl.innerHTML = "";
      Object.entries(scholars).forEach(([id, scholar]) => {
        const img = document.createElement("img");
        img.src = scholar.videos[0].poster; // first video as cover
        img.alt = scholar.name;
        img.addEventListener("click", () => renderScholar(id));
        scholarListEl.appendChild(img);
      });

      if (addToHistory) {
        history.pushState({ page: "home" }, "", window.location.pathname);
      }
    }

    function renderScholar(scholarId, addToHistory = true) {
      const scholar = scholars[scholarId];
      if (!scholar) return;

      scholarListEl.style.display = "none";

      scholarDetailsEl.innerHTML = `<h2>${scholar.name}</h2>`;
      scholarBioEl.innerHTML = `<p>${scholar.bio}</p>`;

      // Render thumbnails
      const grid = document.createElement("div");
      grid.className = "thumbnailGrid";
      scholar.videos.forEach((v, i) => {
        const img = document.createElement("img");
        img.src = v.poster;
        img.alt = `Video ${i + 1}`;
        img.addEventListener("click", () => renderVideoPlayer(scholarId, i));
        grid.appendChild(img);
      });
      scholarVdoEl.innerHTML = "";
      scholarVdoEl.appendChild(grid);

      if (addToHistory) {
        history.pushState({ page: "scholar", scholarId }, "", "?id=" + scholarId);
      }
    }

    function renderVideoPlayer(scholarId, videoIndex, addToHistory = true) {
      const scholar = scholars[scholarId];
      const mainVideo = scholar.videos[videoIndex];

      // Layout container
      const layout = document.createElement("div");
      layout.className = "videoLayout";

      // Main video
      const mainContainer = document.createElement("div");
      mainContainer.id = "mainVideoContainer";
      mainContainer.innerHTML = `
        <video controls autoplay poster="${mainVideo.poster}">
          <source src="${mainVideo.src}" type="video/mp4">
        </video>
      `;
      layout.appendChild(mainContainer);

      // Playlist
      const playlist = document.createElement("div");
      playlist.id = "videoList";
      scholar.videos.forEach((v, i) => {
        if (i !== videoIndex) {
          const thumb = document.createElement("img");
          thumb.src = v.poster;
          thumb.alt = `Video ${i + 1}`;
          thumb.addEventListener("click", () => renderVideoPlayer(scholarId, i));
          playlist.appendChild(thumb);
        }
      });
      layout.appendChild(playlist);

      scholarVdoEl.innerHTML = "";
      scholarVdoEl.appendChild(layout);

      if (addToHistory) {
        history.pushState({ page: "video", scholarId, videoIndex }, "", `?id=${scholarId}&video=${videoIndex}`);
      }
    }

    // =====================
    // History Navigation
    // =====================
    window.onpopstate = function (event) {
      const state = event.state;
      if (!state || state.page === "home") {
        renderHome(false);
      } else if (state.page === "scholar") {
        renderScholar(state.scholarId, false);
      } else if (state.page === "video") {
        renderVideoPlayer(state.scholarId, state.videoIndex, false);
      }
    };

    // =====================
    // On Page Load
    // =====================
    const urlParams = new URLSearchParams(window.location.search);
    const scholarId = urlParams.get("id");
    const videoIndex = urlParams.get("video");

    if (scholarId && scholars[scholarId]) {
      if (videoIndex !== null) {
        renderVideoPlayer(scholarId, Number(videoIndex), false);
      } else {
        renderScholar(scholarId, false);
      }
    } else {
      renderHome(false);
    }
  </script>
</body>
</html>
